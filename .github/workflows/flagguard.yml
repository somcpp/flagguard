# FlagGuard reviewing its own repository (dogfooding). Copy this into your repo and
# replace `uses: ./` with `uses: somcpp/flagguard@main`.
name: FlagGuard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: flagguard-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  guard:
    # PR events, or /flagguard comments on PRs
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/flag'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          flagsmith-api-key: ${{ secrets.FLAGSMITH_API_KEY }}
          flagsmith-project-id: ${{ secrets.FLAGSMITH_PROJECT_ID }}
          # keyhopper: rotate keys and fail over Groq → Gemini when one is rate-limited or overloaded
          groq-api-keys: ${{ secrets.GROQ_API_KEYS }}
          gemini-api-keys: ${{ secrets.GEMINI_API_KEYS }}
          policy: examples/shop/flagguard.yml
